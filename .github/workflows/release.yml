name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag-on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main -- refusing to publish a release built from an unmerged/unreviewed commit"
            exit 1
          fi

  test:
    needs: verify-tag-on-main
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from git tag history; a
          # shallow clone (the default) has no tags and would silently
          # produce a bogus 0.1.dev0 version for every release.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify built version matches the pushed tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          BUILT_VERSION=$(ls dist/*.tar.gz | sed -E 's/.*qec_diverse_circuits-(.*)\.tar\.gz/\1/')
          TAG_VERSION="${TAG_NAME#v}"
          echo "Tag version: $TAG_VERSION / Built version: $BUILT_VERSION"
          if [ "$TAG_VERSION" != "$BUILT_VERSION" ]; then
            echo "::error::Tag $TAG_NAME does not match built package version $BUILT_VERSION"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qec-diverse-circuits
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # TODO: pin to a full commit SHA once verified (see PR discussion) --
      # e.g. `pypa/gh-action-pypi-publish@<40-char-sha> # v1.x.x`.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
