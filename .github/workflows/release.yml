name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from git tag history; a
          # shallow clone (the default) has no tags and would silently
          # produce a bogus 0.1.dev0 version for every release.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify built version matches the pushed tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          BUILT_VERSION=$(ls dist/*.tar.gz | sed -E 's/.*qec_diverse_circuits-(.*)\.tar\.gz/\1/')
          TAG_VERSION="${TAG_NAME#v}"
          echo "Tag version: $TAG_VERSION / Built version: $BUILT_VERSION"
          if [ "$TAG_VERSION" != "$BUILT_VERSION" ]; then
            echo "::error::Tag $TAG_NAME does not match built package version $BUILT_VERSION"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qec-diverse-circuits
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
